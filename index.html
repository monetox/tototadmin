      }, [reservations]);

      useEffect(() => {
        localStorage.setItem('totot_media', JSON.stringify(mediaItems));
      }, [mediaItems]);

      useEffect(() => {
        localStorage.setItem('totot_settings', JSON.stringify(settings));
      }, [settings]);

        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      const toggleMenuAvailability = (id) => {
        setMenuItems(prev => prev.map(item => {
          if (item.id === id) {
            const nextState = !item.available;
            showToast(`${item.name} is now ${nextState ? 'Serving (ON)' : 'Sold Out (OFF)'}`);
            return { ...item, available: nextState };
          }
          return item;
        }));
      };

      const handleSaveDish = (dishData) => {
        if (dishData.id) {
          setMenuItems(prev => prev.map(i => i.id === dishData.id ? dishData : i));
          showToast(`Updated "${dishData.name}"`);
        } else {
          const newDish = {
            ...dishData,
            id: 'dish-' + Date.now(),
            available: true
          };
          setMenuItems(prev => [newDish, ...prev]);
          showToast(`Added "${newDish.name}" to menu`);
        }
        setIsDishModalOpen(false);
        setEditingDish(null);
      };

        const dish = menuItems.find(i => i.id === id);
        if (confirm(`Remove "${dish?.name}" from the menu?`)) {
          setMenuItems(prev => prev.filter(i => i.id !== id));
          showToast(`Removed dish`);
        }

        const newRes = {
          ...resData,
          id: 'res-' + Date.now(),
          status: 'Confirmed'

        setReservations(prev => [newRes, ...prev]);
        setIsResModalOpen(false);
        showToast(`Table booked for ${newRes.customerName}!`);

        setReservations(prev => prev.map(r => r.id === id ? { ...r, status: newStatus } : r));
        showToast(`Reservation marked as ${newStatus}`);

          id: 'med-' + Date.now(),
          type: 'photo'
        };

        a.download = 'totot-menu-catalog.json';

                  {adminTab === 'reservations' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-6">
                        <div>
                          <h2 className="font-serif italic text-3xl font-bold text-[#1A1A1A]">Table Bookings & Ledger</h2>
                          <p className="text-xs text-[#1A1A1A]/60">Manage guest parties, Mesob allocations, and guest requests.</p>
                        </div>
                        <button
                          onClick={() => setIsResModalOpen(true)}
                          className="px-4 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-xs font-bold uppercase tracking-wider hover:bg-[#333333]"
                        >
                          + Manual Reservation
                        </button>
                      </div>

                      <div className="bento-card rounded-md overflow-hidden">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-[#EFECE5] border-b border-[#1A1A1A]/10 uppercase font-bold text-[#1A1A1A]/60 text-[10px]">
                            <tr>
                              <th className="py-3.5 px-4">Guest</th>
                              <th className="py-3.5 px-4">Party Size</th>
                              <th className="py-3.5 px-4">Date & Time</th>
                              <th className="py-3.5 px-4">Status</th>
                              <th className="py-3.5 px-4">Special Notes</th>
                              <th className="py-3.5 px-4 text-right">Quick Status</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#1A1A1A]/10">
                            {reservations.map(res => (
                              <tr key={res.id} className="hover:bg-white">
                                <td className="py-3.5 px-4">
                                  <div className="font-bold text-[#1A1A1A] flex items-center gap-1.5">
                                    <span>{res.customerName}</span>
                                    {res.isVIP && (
                                      <span className="px-1.5 py-0.5 rounded text-[8px] bg-amber-200 text-amber-950 font-bold uppercase">
                                        VIP
                                      </span>
                                    )}
                                  </div>
                                  <div className="text-[10px] text-[#1A1A1A]/60 font-mono">{res.contactPhone}</div>
                                </td>
                                <td className="py-3.5 px-4 font-mono">{res.partySize} Guests</td>
                                <td className="py-3.5 px-4 font-mono">{res.date} • {res.time}</td>
                                <td className="py-3.5 px-4">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                    res.status === 'Confirmed' ? 'bg-emerald-100 text-emerald-900' :
                                    res.status === 'Pending' ? 'bg-amber-100 text-amber-900' :
                                    res.status === 'Completed' ? 'bg-blue-100 text-blue-900' :
                                    'bg-red-100 text-red-900'
                                  }`}>
                                    {res.status}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-[#1A1A1A]/70 text-[11px] max-w-xs truncate">
                                  {res.specialRequests || '—'}
                                </td>
                                <td className="py-3.5 px-4 text-right space-x-1.5">
                                  {['Confirmed', 'Completed', 'Cancelled'].map(st => (
                                    <button
                                      key={st}
                                      onClick={() => handleUpdateReservationStatus(res.id, st)}
                                      className={`text-[10px] px-2 py-1 rounded font-bold uppercase transition-all ${
                                        res.status === st
                                          ? 'bg-[#1A1A1A] text-white'
                                          : 'bg-[#EFECE5] text-[#1A1A1A]/70 hover:bg-[#1A1A1A] hover:text-white'
                                      }`}
                                    >
                                      {st}
                                    </button>
                                  ))}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* TAB 4: ATMOSPHERE MEDIA */}
                  {adminTab === 'media' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-6">
                        <div>
                          <h2 className="font-serif italic text-3xl font-bold text-[#1A1A1A]">Atmosphere & Bento Media</h2>
                          <p className="text-xs text-[#1A1A1A]/60">Manage high-resolution photography displayed on the public dining site.</p>
                        </div>
                        <button
                          onClick={() => setIsMediaModalOpen(true)}
                          className="px-4 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-xs font-bold uppercase tracking-wider hover:bg-[#333333]"
                        >
                          + Add Photo
                        </button>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {mediaItems.map(m => (
                          <div key={m.id} className="bento-card rounded-lg overflow-hidden flex flex-col justify-between">
                            <div className="aspect-4/3 overflow-hidden bg-black">
                              <img src={m.imageUrl} alt={m.title} className="w-full h-full object-cover" />
                            </div>
                            <div className="p-4 space-y-2">
                              <h4 className="font-serif font-bold text-base text-[#1A1A1A]">{m.title}</h4>
                              <p className="text-xs text-[#1A1A1A]/70">{m.caption}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 5: ANALYTICS */}
                  {adminTab === 'analytics' && (
                    <div className="space-y-6">
                      <div className="border-b border-[#1A1A1A]/10 pb-6">
                        <h2 className="font-serif italic text-3xl font-bold text-[#1A1A1A]">Insights & Culinary Analytics</h2>
                        <p className="text-xs text-[#1A1A1A]/60">Operational breakdown and guest attendance metrics.</p>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bento-card p-6 rounded-md space-y-3">
                          <div className="text-xs font-bold uppercase text-[#1A1A1A]/60">Top Ordered Categories</div>
                          <div className="space-y-2 text-xs">
                            <div className="flex justify-between font-bold"><span>Specialties (Kitfo, Dulet)</span><span>68%</span></div>
                            <div className="w-full bg-[#EFECE5] h-2 rounded-full overflow-hidden"><div className="bg-[#1A1A1A] h-full w-[68%]"></div></div>

                            <div className="flex justify-between font-bold pt-2"><span>Drinks (Tej, Buna)</span><span>22%</span></div>
                            <div className="w-full bg-[#EFECE5] h-2 rounded-full overflow-hidden"><div className="bg-[#1A1A1A] h-full w-[22%]"></div></div>

                            <div className="flex justify-between font-bold pt-2"><span>Sides (Kocho, Ayib)</span><span>10%</span></div>
                            <div className="w-full bg-[#EFECE5] h-2 rounded-full overflow-hidden"><div className="bg-[#1A1A1A] h-full w-[10%]"></div></div>
                          </div>
                        </div>

                        <div className="bento-card p-6 rounded-md space-y-3">
                          <div className="text-xs font-bold uppercase text-[#1A1A1A]/60">Average Party Size</div>
                          <div className="text-4xl font-serif font-bold text-[#1A1A1A]">4.6 <span className="text-xs font-sans font-normal text-[#1A1A1A]/60">Guests / Table</span></div>
                          <p className="text-xs text-[#1A1A1A]/70">Mesob tables are optimal for parties of 4 to 8 guests sharing shared platters.</p>
                        </div>

                        <div className="bento-card p-6 rounded-md space-y-3">
                          <div className="text-xs font-bold uppercase text-[#1A1A1A]/60">Peak Service Hours</div>
                          <div className="text-4xl font-serif font-bold text-[#1A1A1A]">19:30 <span className="text-xs font-sans font-normal text-[#1A1A1A]/60">PM Peak</span></div>
                          <p className="text-xs text-[#1A1A1A]/70">Highest concentration of table bookings during dinner coffee ceremonies.</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 6: SETTINGS */}
                  {adminTab === 'settings' && (
                    <div className="space-y-6">
                      <div className="border-b border-[#1A1A1A]/10 pb-6">
                        <h2 className="font-serif italic text-3xl font-bold text-[#1A1A1A]">Restaurant Information</h2>
                        <p className="text-xs text-[#1A1A1A]/60">Update your branch contact details, address, and story headlines.</p>
                      </div>

                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const form = e.target;
                        setSettings({
                          ...settings,
                          brandName: form.brandName.value,
                          phone: form.phone.value,
                          address: form.address.value,
                          subheadline: form.subheadline.value
                        });
                        showToast('Saved restaurant settings!');
                      }} className="bento-card p-6 rounded-md space-y-4 max-w-xl text-xs">
                        <div>
                          <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Restaurant Name</label>
                          <input name="brandName" defaultValue={settings.brandName} required className="bento-input w-full p-2.5 rounded" />
                        </div>

                        <div>
                          <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Phone Number</label>
                          <input name="phone" defaultValue={settings.phone} required className="bento-input w-full p-2.5 rounded font-mono" />
                        </div>

                        <div>
                          <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Physical Location / Address</label>
                          <input name="address" defaultValue={settings.address} required className="bento-input w-full p-2.5 rounded" />
                        </div>

                        <div>
                          <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Homepage Subheadline Story</label>
                          <textarea name="subheadline" defaultValue={settings.subheadline} rows="3" required className="bento-input w-full p-2.5 rounded"></textarea>
                        </div>

                        <button type="submit" className="px-5 py-2 rounded bg-[#1A1A1A] text-white font-bold uppercase text-xs hover:bg-[#333333]">
                          Save Profile Changes
                        </button>
                      </form>
                    </div>
                  )}
                </main>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* GLOBAL MODALS                                                             */}
          {/* ========================================================================= */}
          {/* ADD / EDIT DISH MODAL */}
          {isDishModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bento-card bg-[#FAF8F0] p-6 rounded-lg max-w-md w-full border border-[#1A1A1A]/30 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3">
                  <h3 className="font-serif italic text-xl font-bold">
                    {editingDish ? 'Edit Dish Offering' : 'Add New Dish'}
                  </h3>
                  <button onClick={() => { setIsDishModalOpen(false); setEditingDish(null); }} className="text-base font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleSaveDish({
                    id: editingDish ? editingDish.id : undefined,
                    name: form.dishName.value,
                    category: form.dishCategory.value,
                    price: Number(form.dishPrice.value),
                    description: form.dishDescription.value,
                    available: editingDish ? editingDish.available : true,
                    isFeatured: form.isFeatured.checked
                  });
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Dish Title</label>
                    <input name="dishName" defaultValue={editingDish?.name || ''} required className="bento-input w-full p-2 rounded text-xs" placeholder="e.g. Special Kitfo" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Category</label>
                      <select name="dishCategory" defaultValue={editingDish?.category || 'specialties'} className="bento-input w-full p-2 rounded text-xs">
                        <option value="specialties">Specialties</option>
                        <option value="sides">Sides</option>
                        <option value="drinks">Drinks & Coffee</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Price (ETB)</label>
                      <input name="dishPrice" type="number" defaultValue={editingDish?.price || 500} required className="bento-input w-full p-2 rounded text-xs font-mono" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Description & Spices</label>
                    <textarea name="dishDescription" defaultValue={editingDish?.description || ''} rows="3" required className="bento-input w-full p-2 rounded text-xs" placeholder="Describe spiced butter, kocho, and serving style..."></textarea>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="isFeatured" name="isFeatured" defaultChecked={editingDish?.isFeatured || false} className="rounded" />
                    <label htmlFor="isFeatured" className="text-xs font-medium">Highlight as Featured Specialty</label>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-[#1A1A1A]/10">
                    <button type="button" onClick={() => { setIsDishModalOpen(false); setEditingDish(null); }} className="px-3.5 py-1.5 rounded border border-[#1A1A1A]/20 text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 rounded bg-[#1A1A1A] text-white text-xs font-bold uppercase hover:bg-[#333333]">Save Offering</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MANUAL RESERVATION MODAL */}
          {isResModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bento-card bg-[#FAF8F0] p-6 rounded-lg max-w-md w-full border border-[#1A1A1A]/30 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3">
                  <h3 className="font-serif italic text-xl font-bold">New Table Booking</h3>
                  <button onClick={() => setIsResModalOpen(false)} className="text-base font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleSaveReservation({
                    customerName: form.customerName.value,
                    contactPhone: form.phone.value,
                    partySize: Number(form.partySize.value),
                    time: form.time.value,
                    date: form.date.value,
                    specialRequests: form.notes.value
                  });
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Guest Name</label>
                    <input name="customerName" required className="bento-input w-full p-2 rounded text-xs" placeholder="e.g. Almaz Tsegaye" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Phone</label>
                      <input name="phone" required className="bento-input w-full p-2 rounded text-xs font-mono" placeholder="+251 91..." />
                    </div>
                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Party Size</label>
                      <input name="partySize" type="number" defaultValue={4} min="1" max="20" required className="bento-input w-full p-2 rounded text-xs font-mono" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Date</label>
                      <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="bento-input w-full p-2 rounded text-xs font-mono" />
                    </div>
                    <div>
                      <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Time</label>
                      <input type="time" name="time" defaultValue="19:30" required className="bento-input w-full p-2 rounded text-xs font-mono" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Special Notes</label>
                    <textarea name="notes" rows="2" className="bento-input w-full p-2 rounded text-xs" placeholder="Table preference, spice level..."></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-[#1A1A1A]/10">
                    <button type="button" onClick={() => setIsResModalOpen(false)} className="px-3.5 py-1.5 rounded border border-[#1A1A1A]/20 text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 rounded bg-[#1A1A1A] text-white text-xs font-bold uppercase hover:bg-[#333333]">Confirm Booking</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD PHOTO MODAL */}
          {isMediaModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bento-card bg-[#FAF8F0] p-6 rounded-lg max-w-md w-full border border-[#1A1A1A]/30 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3">
                  <h3 className="font-serif italic text-xl font-bold">Add Atmosphere Photo</h3>
                  <button onClick={() => setIsMediaModalOpen(false)} className="text-base font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleSaveMedia({
                    title: form.title.value,
                    caption: form.caption.value,
                    imageUrl: form.imageUrl.value
                  });
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Photo Title</label>
                    <input name="title" required className="bento-input w-full p-2 rounded" placeholder="e.g. Garden Veranda Mesob" />
                  </div>
                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Image URL</label>
                    <input name="imageUrl" required className="bento-input w-full p-2 rounded" placeholder="https://..." />
                  </div>
                  <div>
                    <label className="block font-bold uppercase text-[10px] text-[#1A1A1A]/70 mb-1">Caption</label>
                    <textarea name="caption" rows="2" required className="bento-input w-full p-2 rounded" placeholder="Atmosphere description..."></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-[#1A1A1A]/10">
                    <button type="button" onClick={() => setIsMediaModalOpen(false)} className="px-3.5 py-1.5 rounded border border-[#1A1A1A]/20 text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 rounded bg-[#1A1A1A] text-white text-xs font-bold uppercase">Save Photo</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
