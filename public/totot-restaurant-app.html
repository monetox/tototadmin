<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Totot Traditional Restaurant & Kitfo - Management Suite & Dining Site</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Playfair Display, Cinzel, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F4F1EA;
      color: #1A1A1A;
    }
    .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .font-cinzel {
      font-family: 'Cinzel', Georgia, serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .bento-card {
      background-color: #FAF8F0;
      border: 1px solid rgba(26, 26, 26, 0.12);
      transition: all 0.2s ease;
    }
    .bento-card:hover {
      border-color: rgba(26, 26, 26, 0.25);
    }
    .bento-input {
      background-color: #FFFFFF;
      border: 1px solid rgba(26, 26, 26, 0.18);
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .bento-input:focus {
      border-color: #1A1A1A;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="antialiased selection:bg-[#1A1A1A] selection:text-[#FDFCF5]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL DATA ---
    const INITIAL_MENU = [
      {
        id: "dish-1",
        name: "Totot Special Kitfo (ልዩ ክትፎ)",
        category: "specialties",
        price: 950,
        available: true,
        isFeatured: true,
        description: "Finely minced prime lean beef blended with spiced clarified butter (Niter Kibbeh) and Mitmita. Served with freshly baked Kocho, Ayib cottage cheese, and Gomen."
      },
      {
        id: "dish-2",
        name: "Gurage Kitfo Leb-Leb (ለብለብ ክትፎ)",
        category: "specialties",
        price: 880,
        available: true,
        isFeatured: true,
        description: "Gently warmed minced beef infused with seasoned butter and cardamom. Served alongside traditional Gurage side dishes and fresh Injera."
      },
      {
        id: "dish-3",
        name: "Gored Gored (ጎረድ ጎረድ)",
        category: "specialties",
        price: 920,
        available: true,
        isFeatured: false,
        description: "Tender cubes of raw beef warmed in purified spiced butter and Awaze dipping sauce."
      },
      {
        id: "dish-4",
        name: "Traditional Kocho (ቆጮ)",
        category: "sides",
        price: 180,
        available: true,
        isFeatured: false,
        description: "Stone-baked enset flatbread prepared according to ancestral Gurage clay griddle techniques."
      },
      {
        id: "dish-5",
        name: "Spiced Ayib & Gomen Kit (አይብና ጎመን)",
        category: "sides",
        price: 240,
        available: true,
        isFeatured: false,
        description: "Fresh homemade curd cheese tossed with steamed collard greens and herbal butter."
      },
      {
        id: "dish-6",
        name: "Jebena Buna Ceremony (ጀበና ቡና)",
        category: "drinks",
        price: 150,
        available: true,
        isFeatured: true,
        description: "Clay pot roasted organic Yirgacheffe coffee brewed over glowing charcoal, accompanied by incense and freshly popped corn."
      },
      {
        id: "dish-7",
        name: "House Honey Tej (ማር ጠጅ)",
        category: "drinks",
        price: 320,
        available: false,
        isFeatured: false,
        description: "Barrel-aged Ethiopian honey wine fermented with Gesho leaves in traditional glass Berele carafes."
      }
    ];

    const INITIAL_RESERVATIONS = [
      {
        id: "res-101",
        guestName: "Yonas Mengistu",
        partySize: 6,
        time: "19:30",
        date: "2026-08-26",
        status: "Confirmed",
        phone: "+251 91 123 4567",
        tableNumber: "T-04 (Mesob)",
        notes: "VIP family celebration. Extra Kocho and Mild Kitfo requested."
      },
      {
        id: "res-102",
        guestName: "Dr. Selamawit Bekele",
        partySize: 4,
        time: "20:00",
        date: "2026-08-26",
        status: "Seated",
        phone: "+251 92 888 9900",
        tableNumber: "T-02",
        notes: "Prefers outdoor garden veranda seating."
      },
      {
        id: "res-103",
        guestName: "Henok Tadesse",
        partySize: 2,
        time: "20:45",
        date: "2026-08-26",
        status: "Pending",
        phone: "+251 94 333 2211",
        tableNumber: "T-08",
        notes: "First time visit. Requested authentic Jebena Buna demonstration."
      }
    ];

    const INITIAL_MEDIA = [
      {
        id: "m-1",
        title: "The Royal Mesob Experience",
        caption: "Shared dining over hand-woven straw tables with warm Kocho and spiced butter.",
        imageUrl: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "m-2",
        title: "Traditional Jebena Coffee",
        caption: "Freshly roasted Yirgacheffe coffee poured from smoking black clay pots.",
        imageUrl: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "m-3",
        title: "Fresh Hand-Chopped Kitfo",
        caption: "Master butchers seasoning premium beef with fragrant Mitmita and Niter Kibbeh.",
        imageUrl: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Storage State
      const [menuItems, setMenuItems] = useState(() => {
        const saved = localStorage.getItem('totot_menu');
        return saved ? JSON.parse(saved) : INITIAL_MENU;
      });

      const [reservations, setReservations] = useState(() => {
        const saved = localStorage.getItem('totot_reservations');
        return saved ? JSON.parse(saved) : INITIAL_RESERVATIONS;
      });

      const [mediaItems, setMediaItems] = useState(() => {
        const saved = localStorage.getItem('totot_media');
        return saved ? JSON.parse(saved) : INITIAL_MEDIA;
      });

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [menuViewMode, setMenuViewMode] = useState('grid');
      const [statusFilter, setStatusFilter] = useState('all');

      // Modals
      const [isAddDishOpen, setIsAddDishOpen] = useState(false);
      const [isAddResOpen, setIsAddResOpen] = useState(false);
      const [editingDish, setEditingDish] = useState(null);
      const [selectedRes, setSelectedRes] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Persistence
      useEffect(() => {
        localStorage.setItem('totot_menu', JSON.stringify(menuItems));
      }, [menuItems]);

      useEffect(() => {
        localStorage.setItem('totot_reservations', JSON.stringify(reservations));
      }, [reservations]);

      useEffect(() => {
        localStorage.setItem('totot_media', JSON.stringify(mediaItems));
      }, [mediaItems]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Menu Actions
      const toggleMenuAvailability = (id) => {
        setMenuItems(prev => prev.map(item => {
          if (item.id === id) {
            const nextState = !item.available;
            showToast(`${item.name} is now ${nextState ? 'Serving (ON)' : 'Sold Out (OFF)'}`);
            return { ...item, available: nextState };
          }
          return item;
        }));
      };

      const handleSaveDish = (dishData) => {
        if (dishData.id) {
          setMenuItems(prev => prev.map(item => item.id === dishData.id ? dishData : item));
          showToast(`Updated "${dishData.name}"`);
        } else {
          const newDish = {
            ...dishData,
            id: 'dish-' + Date.now(),
            available: true
          };
          setMenuItems(prev => [newDish, ...prev]);
          showToast(`Added "${newDish.name}" to menu`);
        }
        setIsAddDishOpen(false);
        setEditingDish(null);
      };

      const handleDeleteDish = (id) => {
        const dish = menuItems.find(i => i.id === id);
        if (confirm(`Remove "${dish?.name}" from menu?`)) {
          setMenuItems(prev => prev.filter(i => i.id !== id));
          showToast('Dish removed');
        }
      };

      // Reservation Actions
      const handleSaveReservation = (resData) => {
        const newRes = {
          ...resData,
          id: 'res-' + Date.now(),
          status: 'Confirmed'
        };
        setReservations(prev => [newRes, ...prev]);
        setIsAddResOpen(false);
        showToast(`Reservation confirmed for ${newRes.guestName}`);
      };

      const handleUpdateResStatus = (id, newStatus) => {
        setReservations(prev => prev.map(r => r.id === id ? { ...r, status: newStatus } : r));
        showToast(`Status updated to ${newStatus}`);
      };

      const activeDishesCount = menuItems.filter(i => i.available).length;
      const soldOutDishesCount = menuItems.filter(i => !i.available).length;

      return (
        <div className="min-h-screen flex flex-col bg-[#F4F1EA]">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-[#1A1A1A] text-[#FDFCF5] px-4 py-2.5 rounded-md shadow-xl text-xs font-mono font-medium flex items-center gap-2 border border-white/20">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              {toastMessage}
            </div>
          )}

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 bg-[#FAF8F0] border-b border-[#1A1A1A]/10 px-4 md:px-8 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded bg-[#1A1A1A] text-[#FAF8F0] flex items-center justify-center font-serif font-bold text-base">
                ጥ
              </div>
              <div>
                <h1 className="font-serif italic font-bold text-lg md:text-xl text-[#1A1A1A] leading-tight">
                  TOTOT <span className="text-xs font-sans not-italic font-bold tracking-widest text-[#1A1A1A]/50 ml-1">KITFO</span>
                </h1>
                <div className="text-[10px] text-[#1A1A1A]/60 font-mono">Gerji, Addis Ababa • Live Management</div>
              </div>
            </div>

            {/* View Switcher Tabs */}
            <nav className="flex items-center gap-1.5 overflow-x-auto py-1">
              {[
                { id: 'dashboard', label: 'Overview' },
                { id: 'menu', label: 'Menu CMS & Toggles' },
                { id: 'reservations', label: 'Reservations' },
                { id: 'consumer', label: 'Customer Website' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`text-[11px] font-bold tracking-wider uppercase px-3 py-1.5 rounded-md transition-all whitespace-nowrap ${
                    currentTab === tab.id
                      ? 'bg-[#1A1A1A] text-[#FDFCF5] shadow-xs'
                      : tab.id === 'consumer'
                      ? 'bg-[#EAE5D8] text-[#1A1A1A] border border-[#1A1A1A]/20 hover:bg-[#1A1A1A] hover:text-[#FDFCF5]'
                      : 'text-[#1A1A1A]/70 hover:bg-[#EFECE5] hover:text-[#1A1A1A]'
                  }`}
                >
                  {tab.id === 'consumer' ? '🌐 ' + tab.label : tab.label}
                </button>
              ))}
            </nav>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1">
            {/* VIEW 1: OVERVIEW DASHBOARD */}
            {currentTab === 'dashboard' && (
              <div className="p-6 md:p-8 max-w-7xl mx-auto space-y-6">
                {/* Metric Summary Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bento-card p-5 rounded-md">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]/50">Active Dishes</div>
                    <div className="text-3xl font-mono font-bold text-emerald-800 mt-1">{activeDishesCount}</div>
                    <div className="text-[11px] text-[#1A1A1A]/60 mt-1">{soldOutDishesCount} sold out / paused</div>
                  </div>

                  <div className="bento-card p-5 rounded-md">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]/50">Today's Bookings</div>
                    <div className="text-3xl font-mono font-bold text-[#1A1A1A] mt-1">{reservations.length}</div>
                    <div className="text-[11px] text-[#1A1A1A]/60 mt-1">12 total guests expected</div>
                  </div>

                  <div className="bento-card p-5 rounded-md">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]/50">Specialty Dish</div>
                    <div className="text-xl font-serif font-bold text-[#1A1A1A] mt-1 truncate">Special Kitfo</div>
                    <div className="text-[11px] text-emerald-700 font-mono mt-1">950 ETB • In Stock</div>
                  </div>

                  <div className="bento-card p-5 rounded-md">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]/50">Restaurant Status</div>
                    <div className="text-lg font-bold text-emerald-800 flex items-center gap-1.5 mt-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                      Open for Dinner
                    </div>
                    <div className="text-[11px] text-[#1A1A1A]/60 mt-1">Gerji branch • Mesob Tables Ready</div>
                  </div>
                </div>

                {/* Quick Kitchen Dispatch: On/Off Toggles directly on Dashboard */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bento-card p-6 rounded-md lg:col-span-2 space-y-4">
                    <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3">
                      <div>
                        <h2 className="font-serif italic text-xl font-bold text-[#1A1A1A]">Kitchen Dispatch & Quick Toggles</h2>
                        <p className="text-xs text-[#1A1A1A]/60">Instantly toggle dish availability on and off for both waitstaff and the consumer website.</p>
                      </div>
                      <button
                        onClick={() => setCurrentTab('menu')}
                        className="text-[11px] font-bold uppercase tracking-wider text-[#1A1A1A]/70 hover:underline"
                      >
                        Open Full Menu CMS →
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {menuItems.map(dish => (
                        <div
                          key={dish.id}
                          className={`p-3.5 rounded border transition-all flex items-center justify-between gap-3 ${
                            dish.available
                              ? 'bg-[#FFFFFF] border-[#1A1A1A]/15 shadow-2xs'
                              : 'bg-[#EAE5D8]/60 border-dashed border-[#1A1A1A]/30 opacity-75'
                          }`}
                        >
                          <div className="min-w-0 flex-1">
                            <div className="text-xs font-bold text-[#1A1A1A] truncate">{dish.name}</div>
                            <div className="text-[11px] font-mono text-[#1A1A1A]/60">{dish.price} ETB • <span className="uppercase text-[9px]">{dish.category}</span></div>
                          </div>

                          {/* Interactive Switch */}
                          <div className="flex items-center gap-2 shrink-0">
                            <button
                              type="button"
                              onClick={() => toggleMenuAvailability(dish.id)}
                              className={`relative inline-flex h-5 w-10 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                                dish.available ? 'bg-emerald-600' : 'bg-[#1A1A1A]/30'
                              }`}
                            >
                              <span
                                className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                                  dish.available ? 'translate-x-5' : 'translate-x-0'
                                }`}
                              />
                            </button>
                            <span className={`text-[10px] font-bold uppercase w-8 ${dish.available ? 'text-emerald-800' : 'text-red-700'}`}>
                              {dish.available ? 'ON' : 'OFF'}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Right Side: Active Reservations */}
                  <div className="bento-card p-6 rounded-md space-y-4">
                    <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3">
                      <div>
                        <h2 className="font-serif italic text-xl font-bold text-[#1A1A1A]">Tonight's Tables</h2>
                        <p className="text-xs text-[#1A1A1A]/60">Current bookings</p>
                      </div>
                      <button
                        onClick={() => setIsAddResOpen(true)}
                        className="text-[10px] font-bold uppercase tracking-wider bg-[#1A1A1A] text-[#FDFCF5] px-2.5 py-1 rounded"
                      >
                        + Book
                      </button>
                    </div>

                    <div className="space-y-2.5">
                      {reservations.map(res => (
                        <div key={res.id} className="p-3 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10 text-xs space-y-1">
                          <div className="flex items-center justify-between font-bold">
                            <span>{res.guestName}</span>
                            <span className="font-mono text-[11px] px-1.5 py-0.5 rounded bg-[#FAF8F0] border border-[#1A1A1A]/10">
                              {res.time}
                            </span>
                          </div>
                          <div className="text-[#1A1A1A]/60 flex items-center justify-between text-[11px]">
                            <span>Party of {res.partySize} • {res.tableNumber}</span>
                            <span className={`font-bold uppercase text-[9px] ${
                              res.status === 'Confirmed' ? 'text-emerald-800' :
                              res.status === 'Seated' ? 'text-blue-800' : 'text-amber-800'
                            }`}>
                              {res.status}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: FULL MENU CMS WITH TOGGLES */}
            {currentTab === 'menu' && (
              <div className="p-6 md:p-8 max-w-7xl mx-auto space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#1A1A1A]/10 pb-6">
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#1A1A1A]/50 mb-1">
                      Menu Catalog & Availability Toggles
                    </div>
                    <h2 className="font-serif italic text-3xl font-bold text-[#1A1A1A]">
                      Dishes & Real-Time Availability
                    </h2>
                    <p className="text-xs text-[#1A1A1A]/60 mt-1">
                      Click the switch on any item to instantly toggle it ON (Serving) or OFF (Sold Out).
                    </p>
                  </div>

                  <div className="flex items-center gap-3">
                    {/* View Switcher */}
                    <div className="flex items-center bg-[#EAE5D8] p-0.5 rounded border border-[#1A1A1A]/10 text-xs font-bold">
                      <button
                        onClick={() => setMenuViewMode('grid')}
                        className={`px-3 py-1 rounded ${menuViewMode === 'grid' ? 'bg-[#FFFFFF] text-[#1A1A1A] shadow-xs' : 'text-[#1A1A1A]/60'}`}
                      >
                        Cards Grid
                      </button>
                      <button
                        onClick={() => setMenuViewMode('table')}
                        className={`px-3 py-1 rounded ${menuViewMode === 'table' ? 'bg-[#FFFFFF] text-[#1A1A1A] shadow-xs' : 'text-[#1A1A1A]/60'}`}
                      >
                        Quick Table
                      </button>
                    </div>

                    <button
                      onClick={() => { setEditingDish(null); setIsAddDishOpen(true); }}
                      className="px-4 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-xs font-bold tracking-wider uppercase hover:bg-[#333333] transition-all"
                    >
                      + Add New Dish
                    </button>
                  </div>
                </div>

                {/* Filters */}
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2 flex-wrap">
                    {['all', 'specialties', 'sides', 'drinks'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider transition-all ${
                          selectedCategory === cat
                            ? 'bg-[#1A1A1A] text-[#FDFCF5]'
                            : 'bg-[#FAF8F0] border border-[#1A1A1A]/15 text-[#1A1A1A]/70 hover:bg-[#EAE5D8]'
                        }`}
                      >
                        {cat === 'all' ? 'All Dishes' : cat}
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    placeholder="Search dishes..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bento-input px-3 py-1.5 rounded text-xs w-60"
                  />
                </div>

                {/* Grid Mode */}
                {menuViewMode === 'grid' ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {menuItems
                      .filter(i => selectedCategory === 'all' || i.category === selectedCategory)
                      .filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()) || i.description.toLowerCase().includes(searchQuery.toLowerCase()))
                      .map(dish => (
                        <div
                          key={dish.id}
                          className={`bento-card p-5 rounded-md flex flex-col justify-between transition-all ${
                            !dish.available ? 'bg-[#EAE5D8]/50 border-dashed border-[#1A1A1A]/30 opacity-75' : ''
                          }`}
                        >
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-[#EFECE5] text-[#1A1A1A]/70">
                                {dish.category}
